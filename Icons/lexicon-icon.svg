<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c2c28"/>
      <stop offset="0.55" stop-color="#6a2521"/>
      <stop offset="1" stop-color="#4c1917"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e2a0"/>
      <stop offset="0.5" stop-color="#d9b356"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="1" stop-color="#efdfba"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.24" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app-icon rounded square, leather -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#leather)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#sheen)"/>

  <!-- gold decorative double frame -->
  <rect x="52" y="52" width="408" height="408" rx="74" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <rect x="70" y="70" width="372" height="372" rx="60" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.8"/>

  <!-- open book -->
  <g filter="url(#soft)">
    <!-- back cover / shadow under pages -->
    <path d="M256 150
             C210 128 158 122 118 132
             L118 356
             C158 346 210 352 256 374
             C302 352 354 346 394 356
             L394 132
             C354 122 302 128 256 150 Z"
          fill="#3a120f"/>
    <!-- left page -->
    <path d="M252 158
             C214 138 168 132 128 140
             L128 350
             C168 342 214 348 252 366 Z"
          fill="url(#page)" stroke="#c9b184" stroke-width="2"/>
    <!-- right page -->
    <path d="M260 158
             C298 138 344 132 384 140
             L384 350
             C344 342 298 348 260 366 Z"
          fill="url(#page)" stroke="#c9b184" stroke-width="2"/>
    <!-- spine center -->
    <path d="M256 158 L256 366" stroke="#b89a63" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- gold serif A on left page -->
  <text x="190" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700"
        text-anchor="middle" fill="#7a2321">A</text>

  <!-- text lines on right page -->
  <g stroke="#2f5d7c" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <line x1="296" y1="212" x2="360" y2="206"/>
    <line x1="296" y1="242" x2="366" y2="236"/>
    <line x1="296" y1="272" x2="356" y2="266"/>
    <line x1="296" y1="302" x2="364" y2="296"/>
  </g>

  <!-- ribbon bookmark -->
  <path d="M256 138 L256 300 L242 282 L228 300 L228 132 Z" fill="#a3352f" stroke="#7a231f" stroke-width="1.5"/>
</svg>

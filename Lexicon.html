<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5f211d">
<meta name="description" content="Lexicon — an app to record, group and memorize English words. Works offline in a single HTML file.">
<title>Lexicon — English vocabulary</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect x='16' y='16' width='480' height='480' rx='104' fill='%235f211d'/><rect x='60' y='60' width='392' height='392' rx='70' fill='none' stroke='%23d9b356' stroke-width='12'/><text x='256' y='360' font-family='Georgia,serif' font-size='300' font-weight='700' text-anchor='middle' fill='%23f2dc97'>A</text></svg>">
<style>
  :root{
    --bg:#2a1f16; --card:#fbf3de; --card2:#f2e6c9; --line:#cdb488;
    --txt:#3a2c20; --muted:#7a6444; --accent:#7a2321; --accent2:#2f5d7c;
    --good:#4b7a3f; --bad:#a3352f; --warn:#8a6210; --shadow:rgba(60,40,20,.28);
    --serif:"Palatino Linotype","Book Antiqua",Georgia,"Iowan Old Style","Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--serif);color:var(--txt);min-height:100vh;font-size:16px;line-height:1.5;
    background-color:#241a12;
    background-image:
      repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 2px,transparent 2px 7px),
      linear-gradient(135deg,#33261a,#241a12);
    background-attachment:fixed;
  }
  header{padding:16px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;
    color:#f1e3bf;border-bottom:4px double #d8b45a;
    background:linear-gradient(180deg,#6a2521,#4c1917);
    box-shadow:0 3px 14px rgba(0,0,0,.45);flex-wrap:wrap}
  header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:1.5px;font-family:var(--serif);
    color:#f4e7c4;text-shadow:0 1px 0 #3a0f0d}
  header .logo{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;background:none;border:none;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  header .logo svg{display:block}
  .langswitch{display:flex;border:1px solid rgba(216,180,90,.55);border-radius:6px;overflow:hidden}
  .langswitch button{background:rgba(255,240,200,.08);color:#f0d98a;border:none;padding:6px 11px;
    font-family:var(--serif);font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.5px;transition:.15s}
  .langswitch button+button{border-left:1px solid rgba(216,180,90,.4)}
  .langswitch button[aria-pressed="true"]{background:#d8b45a;color:#3a0f0d}
  .langswitch button:hover{color:#fff}
  .langswitch button[aria-pressed="true"]:hover{color:#3a0f0d}
  .wrap{max-width:960px;margin:22px auto 46px;padding:26px 34px 60px;background-color:var(--card);
    border:1px solid var(--line);border-radius:4px;
    background-image:radial-gradient(rgba(120,90,50,.06) 1px,transparent 1px);background-size:4px 4px;
    box-shadow:0 1px 0 #efe0bd, 6px 0 18px -8px rgba(0,0,0,.4), -6px 0 18px -8px rgba(0,0,0,.4), 0 18px 50px var(--shadow)}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 22px;border-bottom:2px solid var(--line);padding-bottom:12px}
  nav button{background:var(--card2);color:var(--muted);border:1px solid var(--line);
    padding:9px 16px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;
    font-family:var(--serif);transition:.15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 3px rgba(60,40,20,.18)}
  nav button:hover{color:var(--accent);border-color:var(--accent)}
  nav button.active{background:var(--accent);color:#f7ecd2;border-color:var(--accent);
    box-shadow:0 2px 8px rgba(122,35,33,.4)}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 60%),var(--card);
    border:1px solid var(--line);border-radius:5px;padding:20px;margin-bottom:18px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 4px 14px rgba(60,40,20,.14)}
  h2{font-size:19px;margin:0 0 14px;font-family:var(--serif);color:var(--accent);font-weight:700;letter-spacing:.3px}
  h3{font-size:15px;color:var(--accent);margin:24px 0 10px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:5px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;font-style:italic}
  input,select,textarea{width:100%;background:#fffdf6;color:var(--txt);border:1px solid var(--line);
    border-radius:4px;padding:11px 12px;font-size:15px;font-family:var(--serif)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,35,33,.15)}
  textarea{resize:vertical;min-height:90px;line-height:1.6}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>div{flex:1;min-width:140px}
  .btn{background:linear-gradient(180deg,#8c2c28,#6d1f1d);color:#f6e8cf;border:1px solid #521513;padding:10px 18px;
    border-radius:5px;cursor:pointer;font-size:15px;font-weight:600;font-family:var(--serif);transition:.15s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 5px rgba(60,40,20,.25)}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
  .btn.good{background:linear-gradient(180deg,#5b8f4d,#436b39);border-color:#375b2f;color:#f4f0e2}
  .btn.bad{background:linear-gradient(180deg,#b53f38,#8f2a25);border-color:#6d1e1a}
  .btn.sm{padding:7px 12px;font-size:13.5px;border-radius:4px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .muted{color:var(--muted)}
  .pill{display:inline-block;background:#fffdf6;border:1px solid var(--line);border-radius:4px;
    padding:3px 11px;font-size:13px;color:var(--txt);margin:0 6px 6px 0}
  .word-item{display:flex;align-items:center;gap:12px;padding:10px 8px;
    border-bottom:1px dotted var(--line);background:transparent;margin-bottom:0;
    content-visibility:auto;contain-intrinsic-size:auto 60px}
  .word-item:hover{background:rgba(122,35,33,.05)}
  .word-item .en{font-weight:700;font-size:17px;font-family:var(--serif);color:var(--txt)}
  .word-item .ipa{color:var(--accent2);font-size:14px;font-style:italic}
  .word-item .ru{color:#5f4d38;font-size:15px}
  .word-item .grow{flex:1;min-width:0}
  .icon-btn{background:#fffdf6;border:1px solid var(--line);color:var(--txt);width:38px;height:38px;
    border-radius:5px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);background:#fff}
  #settingsBtn{background:rgba(255,240,200,.10);border:1px solid rgba(216,180,90,.55);color:#f0d98a;box-shadow:none}
  #settingsBtn:hover{background:rgba(255,240,200,.20);border-color:#e6c669;color:#fbeeb8}
  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-style:italic}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input,.toolbar select{width:auto;flex:1;min-width:150px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fbf3de;color:var(--txt);
    border:1px solid var(--accent);border-left:5px solid var(--accent);padding:12px 20px;border-radius:4px;
    box-shadow:0 8px 30px var(--shadow);z-index:300;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1;bottom:34px}
  .toast.err{border-color:var(--bad);border-left-color:var(--bad)}
  .fc-stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0}
  .fc-progress{width:100%;height:8px;background:var(--card2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .fc-progress>div{height:100%;background:linear-gradient(90deg,var(--accent),#a84f3a);transition:.3s}
  .flashcard{width:100%;max-width:440px;height:260px;perspective:1200px;cursor:pointer}
  .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
  .flashcard.flipped .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;padding:50px 18px 16px;text-align:center;
    border:1px solid var(--line);box-shadow:0 8px 22px var(--shadow);
    background-color:#fffdf6;
    background-image:linear-gradient(rgba(47,93,124,.14) 1px,transparent 1px);background-size:100% 30px;
    background-position:0 60px}
  .fc-face::before{content:"";position:absolute;top:44px;left:0;right:0;height:2px;background:rgba(163,53,47,.55)}
  .fc-back{transform:rotateY(180deg)}
  .fc-flow{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
  .fc-word{font-size:32px;font-weight:700;font-family:var(--serif);color:var(--txt);overflow-wrap:anywhere;line-height:1.12;max-width:100%}
  .fc-sub{color:var(--accent2);font-size:17px;font-style:italic;overflow-wrap:anywhere;max-width:100%}
  .fc-hint{color:var(--muted);font-size:12px;font-style:italic;flex:0 0 auto;margin-top:4px}
  .fc-controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;max-width:440px}
  .fc-controls .btn{flex:1}
  .modeswitch{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:2px 0}
  .modeswitch button{flex:1;background:var(--card2);color:var(--muted);border:none;padding:10px 6px;
    font-family:var(--serif);font-weight:600;font-size:14px;cursor:pointer;transition:.15s;line-height:1.25}
  .modeswitch button+button{border-left:1px solid var(--line)}
  .modeswitch button.active{background:var(--accent);color:#f7ecd2}
  .modeswitch button:hover:not(.active){color:var(--accent);background:#f6ead0}
  .mode-desc{margin:6px 0 4px;min-height:1.1em}
  .fc-answer{display:flex;gap:10px;width:100%;max-width:440px}
  .fc-answer input{flex:1;text-align:center;font-size:18px}
  .fc-badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:12.5px;font-weight:700;
    padding:4px 12px;border-radius:20px;font-style:normal;white-space:nowrap;max-width:90%;overflow:hidden;
    text-overflow:ellipsis;z-index:2}
  .fc-badge.ok{background:#e7f0df;color:var(--good);border:1px solid var(--good)}
  .fc-badge.no{background:#f6e2df;color:var(--bad);border:1px solid var(--bad)}
  .fc-timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent2);font-style:normal}
  .timer-stat{font-size:12.5px;color:var(--accent2);font-style:normal;margin-top:4px}
  .fc-pos{font-size:11.5px;color:var(--muted);font-style:normal;text-transform:uppercase;letter-spacing:1.2px}
  .grp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:nowrap}
  .grp-head>.split{flex:0 0 auto;flex-wrap:nowrap;gap:6px}
  .grp-title{display:flex;align-items:flex-start;gap:6px;cursor:pointer;min-width:0;flex:1 1 auto;padding-top:3px}
  .grp-title h2{overflow-wrap:anywhere;word-break:break-word;line-height:1.3}
  .grp-move{display:inline-flex;gap:4px}
  .icon-btn.mv{width:32px;height:32px;font-size:12px}
  .icon-btn:disabled{opacity:.35;cursor:not-allowed}
  .icon-btn:disabled:hover{border-color:var(--line);color:var(--txt);background:#fffdf6}
  .pager{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 4px 2px}
  .pager.pager-top{margin:2px 4px 16px}
  .gv-bar{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
  .gv-bar .seg{background:var(--card2);color:var(--muted);border:1px solid var(--line);border-radius:8px;
    padding:7px 13px;cursor:pointer;font-family:var(--serif);font-weight:600;font-size:14px;transition:.15s}
  .gv-bar .seg:hover:not(.active){color:var(--accent);border-color:var(--accent)}
  .gv-bar .seg.active{background:var(--accent);color:#f7ecd2;border-color:var(--accent)}
  .gv-bar .seg .seg-n{opacity:.75;font-weight:400;font-size:12px;margin-left:2px}
  .icon-btn.grp-fav.on{color:#d8a520;border-color:#d8a520}
  .pager .btn.sm{min-width:40px;padding:7px 10px}
  .pager-info{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0 4px}
  .grp-chevron{transition:transform .2s;color:var(--muted);flex:0 0 auto;font-size:14px}
  .grp-open .grp-chevron{transform:rotate(90deg)}
  .pick-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fffdf6;margin-bottom:6px;cursor:pointer}
  .pick-row:hover{background:rgba(122,35,33,.05)}
  .pick-row input{width:auto;flex:0 0 auto;margin-top:3px}
  .pick-row .pk-en{font-weight:700}
  .pick-row .pk-ru{color:#5f4d38;font-size:14px}
  .stat-big{font-size:46px;font-weight:700;font-family:var(--serif)}
  .stat-good{color:var(--good)}.stat-bad{color:var(--bad)}
  .checkline{display:flex;align-items:center;gap:8px;margin:8px 0}
  .checkline input{width:auto}
  .group-pick{display:flex;align-items:center;gap:10px;margin:0;padding:10px 12px;border:1px solid var(--line);
    border-radius:4px;background:#fffdf6;margin-bottom:8px;cursor:pointer;font-style:normal}
  .group-pick input{width:auto;flex:0 0 auto}
  select option{background:#fffdf6}
  .split{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  a.link{color:var(--accent);cursor:pointer}
  .badge{font-size:11.5px;padding:3px 10px;border-radius:4px;background:rgba(255,255,255,.1);
    border:1px solid #d8b45a;color:#f0e2bd;font-style:italic}
  .modal-overlay{position:fixed;inset:0;background:rgba(35,22,12,.6);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:400;padding:20px}
  .modal-box{background-color:var(--card);border:1px solid var(--line);border-radius:5px;padding:24px;
    max-width:660px;width:100%;max-height:90vh;overflow:auto;
    background-image:radial-gradient(rgba(120,90,50,.06) 1px,transparent 1px);background-size:4px 4px;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-box:focus{outline:none}
  .modal-box h2{margin-top:0}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;align-items:center;flex-wrap:wrap}
  .modal-scroll{max-height:56vh;overflow:auto;margin-top:12px;padding-right:4px}
  .review-row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);
    border-radius:4px;background:#fffdf6;margin-bottom:8px}
  .review-row input.rv-inc{width:auto;flex:0 0 auto}
  .review-row .rv-en{flex:1 1 130px;min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .review-row .rv-ru{flex:1 1 120px;min-width:0}
  .review-row .rv-pos{flex:0 1 160px;min-width:0;max-width:180px}
  .review-row .rv-edit,.review-row .rv-play{flex:0 0 auto}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  button:focus-visible,a.link:focus-visible,.flashcard:focus-visible,[role="tab"]:focus-visible,[tabindex="0"]:focus-visible{
    outline:3px solid var(--accent2);outline-offset:2px}
  header button:focus-visible,#settingsBtn:focus-visible,.langswitch button:focus-visible{outline-color:#f4dd8f}
  .btn.good:focus-visible,.btn.bad:focus-visible{outline-color:#2a1f16}
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--card)}
  ::-webkit-scrollbar-track{background:transparent}
  @media (max-width:640px){
    header{padding:10px 12px;gap:8px}
    header h1{font-size:18px;letter-spacing:1px}
    .wrap{margin:10px auto 24px;padding:14px 12px 34px;border-radius:0;border-left:none;border-right:none}
    nav{gap:4px;padding-bottom:8px;margin-bottom:16px}
    nav button{padding:7px 10px;font-size:13px}
    .card{padding:14px}
    .row>div{flex:1 1 100%;min-width:0}
    .row>div[style*="max-width"]{max-width:none!important}
    .toolbar input,.toolbar select{flex:1 1 100%;min-width:0}
    .flashcard{height:220px;max-width:100%}
    .fc-word{font-size:26px}
    .fc-controls{max-width:100%}
    .modal-overlay{padding:8px;align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    .modal-box{padding:16px;max-height:none;margin:auto}
    .modal-scroll{max-height:none;overflow:visible;padding-right:0}
    .stat-big{font-size:36px}
    .icon-btn{width:42px;height:42px}
    .review-row .rv-ru,.review-row .rv-pos{flex:1 1 100%;max-width:none}
    .grp-head{flex-direction:column;align-items:stretch;gap:10px}
    .grp-title{padding-top:0}
    .grp-head>.split{flex-wrap:wrap;width:100%;justify-content:flex-start}
  }
  @media (max-width:560px){
    #countBadge{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <rect x="16" y="16" width="480" height="480" rx="96" fill="#5f211d"/>
    <rect x="56" y="56" width="400" height="400" rx="66" fill="none" stroke="#d9b356" stroke-width="10"/>
    <path d="M256 168 C214 148 168 144 132 152 L132 344 C168 336 214 342 256 360 C298 342 344 336 380 344 L380 152 C344 144 298 148 256 168 Z" fill="#fdf6e3" stroke="#c9b184" stroke-width="3"/>
    <path d="M256 168 L256 360" stroke="#b89a63" stroke-width="4"/>
    <text x="192" y="300" font-family="Georgia,serif" font-size="96" font-weight="700" text-anchor="middle" fill="#7a2321">A</text>
    <g stroke="#2f5d7c" stroke-width="10" stroke-linecap="round" opacity="0.8">
      <line x1="292" y1="220" x2="356" y2="214"/>
      <line x1="292" y1="252" x2="360" y2="246"/>
      <line x1="292" y1="284" x2="352" y2="278"/>
    </g>
  </svg></div>
  <h1>Lexicon</h1>
  <span class="badge" id="countBadge" style="margin-left:auto" aria-live="polite"></span>
  <div class="langswitch" role="group" id="langSwitch" aria-label="Language / Язык" style="margin-left:auto">
    <button type="button" data-setlang="en">EN</button>
    <button type="button" data-setlang="ru">RU</button>
  </div>
  <button class="icon-btn" id="settingsBtn" data-i18n-title="settings" data-i18n-aria="settings" aria-haspopup="dialog">⚙️</button>
  <input type="file" id="importFile" accept=".json,.csv,.txt" data-i18n-aria="importFileAria" style="display:none">
</header>
<div class="wrap">
  <nav role="tablist" data-i18n-aria="navAria">
    <button role="tab" id="tabbtn-add" aria-controls="tab-add" aria-selected="true" data-tab="add" class="active"><span aria-hidden="true">➕</span> <span data-i18n="tab_add">Add</span></button>
    <button role="tab" id="tabbtn-dict" aria-controls="tab-dict" aria-selected="false" tabindex="-1" data-tab="dict"><span aria-hidden="true">📚</span> <span data-i18n="tab_dict">Dictionary</span></button>
    <button role="tab" id="tabbtn-groups" aria-controls="tab-groups" aria-selected="false" tabindex="-1" data-tab="groups"><span aria-hidden="true">📁</span> <span data-i18n="tab_groups">Groups</span></button>
    <button role="tab" id="tabbtn-cards" aria-controls="tab-cards" aria-selected="false" tabindex="-1" data-tab="cards"><span aria-hidden="true">🎴</span> <span data-i18n="tab_cards">Cards</span></button>
  </nav>

  <section id="tab-add" role="tabpanel" aria-labelledby="tabbtn-add" tabindex="0">
    <div class="card">
      <h2 data-i18n="h_addOne">Add a word</h2>
      <div class="row">
        <div>
          <label for="addEn" data-i18n="lbl_en">English word</label>
          <input id="addEn" data-i18n-ph="ph_en" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" lang="en">
        </div>
        <div style="flex:0 0 auto;display:flex;align-items:flex-end">
          <button class="btn ghost" id="fetchBtn" data-i18n="btn_fetch">🔎 Fetch data</button>
        </div>
      </div>
      <div class="row">
        <div>

function t(key,...a){const v=STR[lang]&&STR[lang][key];if(v==null)return key;return typeof v==='function'?v(...a):v;}

function sanTimer(tm){
  const out={};
  if(tm&&typeof tm==='object'){
    ['en','ru'].forEach(k=>{
      const e=tm[k];
      if(e&&typeof e==='object'){
        const best=Math.max(0,Math.floor(Number(e.best))||0);
        const last=Math.max(0,Math.floor(Number(e.last))||0);
        const runs=Math.max(0,Math.floor(Number(e.runs))||0);
        if(best>0||last>0||runs>0)out[k]={best,last,runs};
      }
    });
  }
  return out;
}
function load(){
  let parsed=null;
  try{const raw=localStorage.getItem(KEY);if(raw)parsed=JSON.parse(raw);}catch(e){parsed=null;}
  hydrate(parsed);
}
function hydrate(parsed){
  if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))parsed={};
  state={words:[],groups:[]};
  const words=Array.isArray(parsed.words)?parsed.words:[];
  words.forEach(w=>{
    if(!w||typeof w!=='object')return;
    const en=(w.en==null?'':String(w.en)).trim();
    if(!en)return;
    const st=(w.stats&&typeof w.stats==='object')?w.stats:{};
    const seen=Math.max(0,Math.floor(Number(st.seen))||0);
    const right=Math.max(0,Math.floor(Number(st.right))||0);
    const wrong=Math.max(0,Math.floor(Number(st.wrong))||0);
    state.words.push({
      id:(w.id!=null?String(w.id):uid()),
      en,
      ru:(w.ru==null?'':String(w.ru)),
      ipa:(w.ipa==null?'':String(w.ipa)),
      pos:POS_SET.has(w.pos)?w.pos:'other',
      audio:(w.audio==null?'':String(w.audio)),
      created:Number(w.created)||Date.now(),
      stats:{seen,right:Math.min(right,seen),wrong:Math.min(wrong,seen)}
    });
  });
  const seenIds=new Set(state.words.map(w=>w.id));
  const groups=Array.isArray(parsed.groups)?parsed.groups:[];
  groups.forEach(g=>{
    if(!g||typeof g!=='object')return;
    const wordIds=Array.isArray(g.wordIds)?g.wordIds.map(String).filter(id=>seenIds.has(id)):[];
    state.groups.push({
      id:(g.id!=null?String(g.id):uid()),
      name:(g.name==null?'Group':String(g.name)),
      wordIds:Array.from(new Set(wordIds)),
      timer:sanTimer(g.timer),
      fav:!!g.fav
    });
  });
}
function acc(w){return (w.stats&&w.stats.seen)?Math.round(w.stats.right/w.stats.seen*100):null;}
function statBadge(w){
  const a=acc(w);
  if(a===null)return `<span class="pill" style="margin:0">${t('stat_new')}</span>`;
  const col=a>=80?'var(--good)':a>=60?'var(--warn)':'var(--bad)';
  return `<span class="pill" style="margin:0;color:${col};border-color:${col}">${a}% · ${w.stats.seen} ${repsLabel(w.stats.seen)}</span>`;
}
let storageFailed=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));storageFailed=false;}
  catch(e){if(!storageFailed){storageFailed=true;toast(t('t_saveFail'),true);}}
  updateBadge();
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

let toastT;
function toast(msg,err){

  el.textContent=msg;
  el.className='toast show'+(err?' err':'');
  clearTimeout(toastT);toastT=setTimeout(()=>el.className='toast',2800);
}

let voices=[];
function loadVoices(){try{voices=window.speechSynthesis?speechSynthesis.getVoices():[];}catch(e){voices=[];}}
if(window.speechSynthesis){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
let currentAudio=null,fcAutoplayTimer=null;
function stopAudio(){
  if(currentAudio){try{currentAudio.pause();currentAudio.removeAttribute('src');currentAudio.load();}catch(e){}currentAudio=null;}
  try{if(window.speechSynthesis&&(speechSynthesis.speaking||speechSynthesis.pending))speechSynthesis.cancel();}catch(e){}
}
function cancelCardAudio(){if(fcAutoplayTimer){clearTimeout(fcAutoplayTimer);fcAutoplayTimer=null;}stopAudio();}
function cardAutoplay(w){fcAutoplayTimer=setTimeout(()=>{fcAutoplayTimer=null;speak(w.en,w.audio);},250);}
function speak(word,audioUrl){
  word=(word==null?'':String(word)).trim();
  if(!word)return;
  stopAudio();
  if(audioUrl){
    try{const a=new Audio(audioUrl);currentAudio=a;a.play().then(()=>{}).catch(()=>{if(currentAudio===a){currentAudio=null;ttsSpeak(word);}});return;}catch(e){}
  }
  ttsSpeak(word);
}
function ttsSpeak(word){
  if(!window.speechSynthesis||typeof SpeechSynthesisUtterance==='undefined'){toast(t('t_ttsUnsupported'),true);return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);
    u.lang='en-US';u.rate=.9;
    const v=voices.find(v=>/en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){toast(t('t_ttsFail'),true);}
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function isOffline(){return typeof navigator!=='undefined'&&navigator.onLine===false;}
async function fetchJSON(url,tries=3){
  if(isOffline())return null;
  for(let a=0;a<tries;a++){
    let timer;
    try{
      const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
      if(ctl)timer=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(url,ctl?{signal:ctl.signal}:undefined);
      if(timer)clearTimeout(timer);
      if(r.ok)return await r.json();
      if(r.status===429||r.status>=500){await sleep(700*(a+1));continue;}
      return null;
    }catch(e){if(timer)clearTimeout(timer);await sleep(500*(a+1));}
  }
  return null;
}
async function fetchDict(word){
  const w=word.trim().toLowerCase().replace(/^to\s+/,'');
  if(!w||/\s/.test(w))return null;
  try{
    const data=await fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));
    if(!Array.isArray(data))return null;const e=data[0];if(!e)return null;
    let ipa='';let audio='';
    if(e.phonetic)ipa=e.phonetic;
    (e.phonetics||[]).forEach(p=>{if(!ipa&&p.text)ipa=p.text;if(!audio&&p.audio)audio=p.audio;});
    if(audio&&audio.startsWith('//'))audio='https:'+audio;
    let pos='';let posList=[];
    (e.meanings||[]).forEach(m=>{if(m.partOfSpeech){if(!pos)pos=m.partOfSpeech;if(!posList.includes(m.partOfSpeech))posList.push(m.partOfSpeech);}});
    return {ipa,audio,pos,posList};
  }catch(e){return null;}
}
async function fetchTranslate(word){
  const d=await fetchJSON('https://api.mymemory.translated.net/get?langpair=en|ru&q='+encodeURIComponent(word));
  if(d){
    const tr=d.responseData&&d.responseData.translatedText;
    if(tr&&d.responseStatus==200&&!/INVALID|QUERY LENGTH|MYMEMORY WARNING/i.test(tr))return tr.trim();
  }
  const g=await fetchJSON('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q='+encodeURIComponent(word));
  if(g&&Array.isArray(g[0]))return g[0].map(x=>x&&x[0]?x[0]:'').join('').trim();
  return '';
}
const RU_POS_TO_KEY={'существительное':'noun','имя существительное':'noun','глагол':'verb',
  'прилагательное':'adjective','имя прилагательное':'adjective','наречие':'adverb',
  'местоимение':'pronoun','предлог':'preposition','союз':'conjunction','междометие':'interjection',
  'числительное':'other','имя числительное':'other','частица':'other','артикль':'other',
  'причастие':'verb','словосочетание':'phrase','фраза':'phrase','сокращение':'other','приставка':'other'};
const POS_ALIAS={exclamation:'interjection',abbreviation:'other',article:'other',
  numeral:'other',number:'other',determiner:'pronoun',particle:'other',prefix:'other',suffix:'other'};
function normPos(p){
  p=(p||'').toLowerCase().trim();
  if(POS_SET.has(p))return p;
  if(POS_ALIAS[p])return POS_ALIAS[p];
  if(RU_POS_TO_KEY[p])return RU_POS_TO_KEY[p];
  if(p.includes('phrase')||p.includes('словосоч'))return 'phrase';
  return 'other';
}
async function fetchVariants(word){
  const out={main:'',groups:[]};
  try{
    const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&dt=bd&q='+encodeURIComponent(word);
    const d=await fetchJSON(url);
    if(d){
      if(Array.isArray(d[0]))out.main=d[0].map(x=>x&&x[0]?x[0]:'').join('').trim();
      if(Array.isArray(d[1])){
        d[1].forEach(block=>{
          if(!Array.isArray(block))return;
          const pos=normPos(block[0]);
          let terms=Array.isArray(block[1])?block[1].slice():[];
          terms=terms.filter(Boolean).slice(0,6);
          if(terms.length){
            const ex=out.groups.find(g=>g.pos===pos);
            if(ex)ex.terms=Array.from(new Set(ex.terms.concat(terms))).slice(0,8);
            else out.groups.push({pos,terms});
          }
        });
      }
    }
  }catch(e){}
  if(!out.main)out.main=await fetchTranslate(word);
  return out;
}
async function enrich(obj){
  const d=await fetchDict(obj.en);
  if(d){
    if(!obj.ipa&&d.ipa)obj.ipa=d.ipa;
    if(!obj.audio&&d.audio)obj.audio=d.audio;
  }
  const multi=/[\s/]/.test(obj.en.trim());
  const needRu=!obj.ru;
  const needPos=!obj.pos||obj.pos==='other';
  if(needRu||needPos){
    const v=await fetchVariants(obj.en);
    if(needRu)obj.ru=v.groups.length?(v.groups[0].terms[0]||v.main):v.main;
    if(needPos){
      if(v.groups.length)obj.pos=v.groups[0].pos;
      else if(d&&d.pos)obj.pos=normPos(d.pos);
    }
  }
  if((!obj.pos||obj.pos==='other')&&multi)obj.pos='phrase';
  if(!obj.pos)obj.pos='other';
  return obj;
}

function canonVariant(s){
  return String(s==null?'':s).toLowerCase().replace(/ё/g,'е').replace(/\([^)]*\)/g,' ').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
}
function dedupeTranslations(str){
  const parts=[];const seen=new Set();
  String(str==null?'':str).split(/\s*[;,]\s*/).forEach(p=>{
    p=p.trim();if(!p)return;
    const key=canonVariant(p)||p.toLowerCase();
    if(!seen.has(key)){seen.add(key);parts.push(p);}
  });
  return parts.join(', ');
}
function mergeTranslations(a,b){return dedupeTranslations([a,b].filter(Boolean).join(', '));}
function findWordByEn(en){const k=String(en||'').trim().toLowerCase();return k?state.words.find(w=>w.en.toLowerCase()===k):null;}
function findWordByEnPos(en,pos){const k=String(en||'').trim().toLowerCase();if(!k)return null;const p=normPos(pos||'other');return state.words.find(w=>w.en.toLowerCase()===k&&normPos(w.pos||'other')===p)||null;}
function addOrMergeWord(obj){
  const en=String(obj.en||'').trim();if(!en)return null;
  const pos=normPos(obj.pos||'other');
  let ex=findWordByEnPos(en,pos);
  if(!ex&&pos!=='other'){const k=en.toLowerCase();ex=state.words.find(w=>w.en.toLowerCase()===k&&normPos(w.pos||'other')==='other')||null;if(ex)ex.pos=pos;}
  if(ex){
    if(obj.ru)ex.ru=mergeTranslations(ex.ru,obj.ru);
    if(!ex.ipa&&obj.ipa)ex.ipa=obj.ipa;
    if(!ex.audio&&obj.audio)ex.audio=obj.audio;
    if((!ex.pos||ex.pos==='other')&&pos!=='other')ex.pos=pos;
    if(obj.stats){if(!ex.stats)ex.stats={seen:0,right:0,wrong:0};ex.stats.seen+=obj.stats.seen||0;ex.stats.right+=obj.stats.right||0;ex.stats.wrong+=obj.stats.wrong||0;}
    return {word:ex,merged:true};
  }
  const w={id:uid(),en,ru:dedupeTranslations(obj.ru),ipa:obj.ipa||'',pos:pos,audio:obj.audio||'',created:obj.created||Date.now(),stats:obj.stats||{seen:0,right:0,wrong:0}};
  state.words.push(w);
  return {word:w,merged:false};
}

function wordSearchMatch(w,q){
  if(!q)return true;
  const en=w.en.toLowerCase(),ru=(w.ru||'').toLowerCase();
  if(q.length===1)return en.startsWith(q)||ru.split(/[;,]/).some(p=>p.trim().startsWith(q));

}
function wordExactMatch(w,q){
  if(!q)return false;

}

const DICT_PAGE=50;
let dictPage=1;
function renderDict(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const pf=document.getElementById('posFilter').value;
  const sort=document.getElementById('dictSort').value;
  const list=document.getElementById('dictList');list.innerHTML='';
  const pagers=[document.getElementById('dictPagerTop'),document.getElementById('dictPager')];
  const hidePagers=()=>pagers.forEach(p=>{if(p){p.style.display='none';p.innerHTML='';}});
  let words=state.words.filter(w=>{
    if(pf&&w.pos!==pf)return false;
    if(q&&!wordSearchMatch(w,q))return false;
    return true;
  });
  if(!words.length){list.innerHTML='<div class="empty">'+(state.words.length?esc(t('empty_search')):esc(t('empty_dict')))+'</div>';hidePagers();return;}
  let ordered,counts=null,grouped=false;
  if(q){
    const cmp=sort==='recent'?(a,b)=>(b.created||0)-(a.created||0):(a,b)=>a.en.localeCompare(b.en);
    ordered=words.sort((a,b)=>{const r=(wordExactMatch(a,q)?0:1)-(wordExactMatch(b,q)?0:1);return r||cmp(a,b);});
  }else if(sort==='recent'){
    ordered=words.sort((a,b)=>(b.created||0)-(a.created||0));
  }else{
    grouped=true;counts={};ordered=[];
    const groups={};
    words.forEach(w=>{(groups[w.pos]=groups[w.pos]||[]).push(w);});
    POS_KEYS.forEach(pos=>{if(!groups[pos])return;counts[pos]=groups[pos].length;groups[pos].sort((a,b)=>a.en.localeCompare(b.en)).forEach(w=>ordered.push(w));});
  }
  const total=ordered.length;
  const pages=Math.ceil(total/DICT_PAGE);
  if(dictPage>pages)dictPage=pages;if(dictPage<1)dictPage=1;
  const start=(dictPage-1)*DICT_PAGE,end=Math.min(start+DICT_PAGE,total);
  const frag=document.createDocumentFragment();
  let lastPos=null;
  for(let i=start;i<end;i++){
    const w=ordered[i];
    if(grouped&&w.pos!==lastPos){lastPos=w.pos;const h=document.createElement('h3');h.textContent=posLabel(w.pos)+' · '+counts[w.pos];frag.appendChild(h);}
    frag.appendChild(wordRow(w));
  }
  list.appendChild(frag);
  pagers.forEach(p=>makePager(p,dictPage,pages,total,start,end,n=>{dictPage=n;renderDict();window.scrollTo(0,0);}));
}

const POS_LABEL_TO_KEY={};
POS_KEYS.forEach(k=>{POS_LABEL_TO_KEY[k]=k;POS_LABEL_TO_KEY[POS_NAMES.en[k].toLowerCase()]=k;POS_LABEL_TO_KEY[POS_NAMES.ru[k].toLowerCase()]=k;});
function labelToPos(s){s=(s||'').toLowerCase().trim();return POS_LABEL_TO_KEY[s]||normPos(s);}
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c==='\r'){} else cur+=c;}
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{importData(r.result);}catch(err){toast(t('t_parseFail'),true);}e.target.value='';};
  r.onerror=()=>{toast(t('t_readFail'),true);e.target.value='';};
  r.readAsText(f);
};
function importData(text){
  const trimmed=String(text||'').replace(/^﻿/,'').trim();
  if(trimmed.charAt(0)==='{'){
    let obj=null;try{obj=JSON.parse(trimmed);}catch(e){obj=null;}
    if(obj&&typeof obj==='object'){
      const data=(obj.data&&typeof obj.data==='object')?obj.data:obj;
      if(Array.isArray(data.words)||Array.isArray(data.groups)){importBackup(data);return;}
    }
    toast(t('t_parseFail'),true);return;
  }
  doImport(text);
}
function importBackup(data){
  const apply=()=>{
    hydrate({words:data.words||[],groups:data.groups||[]});
    expandedGroups=new Set();groupView='all';groupFilter='';groupsPage=1;dictPage=1;
    save();renderDict();renderGroups();renderCardSetup();
    toast(t('importRestored',state.words.length,state.groups.length));
  };
  if(state.words.length||state.groups.length){
    openConfirm({title:t('h_importReplace'),message:t('c_importReplace'),confirmLabel:t('btn_importReplace'),cancelLabel:t('btn_cancel'),danger:true,onConfirm:apply});
  }else apply();
}
function doImport(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>(c||'').trim()!==''));
  if(!rows.length){toast(t('t_fileEmpty'),true);return;}
  let start=0;const h=rows[0].map(c=>(c||'').toLowerCase().trim());
  if(h[0]==='english'||h[0]==='en'||h.includes('russian')||h.includes('перевод'))start=1;
  let added=0,merged=0;
  for(let i=start;i<rows.length;i++){
    const r=rows[i];const en=(r[0]||'').trim();if(!en)continue;
    const res=addOrMergeWord({en,ru:(r[1]||'').trim(),ipa:(r[2]||'').trim(),pos:labelToPos(r[3])||'other',audio:'',created:Date.now()+i});
    if(res){if(res.merged)merged++;else added++;}
  }
  save();renderDict();
  toast(t('importMerged',added,merged));
}

            <button class="icon-btn mv" data-down ${bi>=base.length-1?'disabled':''} aria-label="${esc(t('ariaMoveGroupDown',g.name))}">▼</button>
          </span>`:''}
          <button class="icon-btn grp-fav${g.fav?' on':''}" data-fav aria-pressed="${g.fav?'true':'false'}" aria-label="${esc(t(g.fav?'ariaUnfav':'ariaFav',g.name))}">${g.fav?'★':'☆'}</button>

          <button class="icon-btn" data-del aria-label="${esc(t('ariaDelGroup',g.name))}">🗑</button>
        </div>
      </div>

      <div data-words class="grp-words" style="${open?'':'display:none'}"></div>`;
    const wc=card.querySelector('[data-words]');

      wc.innerHTML='';

      const frag=document.createDocumentFragment();

        r.innerHTML=`<button class="icon-btn play" aria-label="${esc(t('listenW',w.en))}">🔊</button>

        wc.addEventListener('click',e=>{

  groupsPage=Math.floor(j/GROUPS_PAGE)+1;

function normAns(s){
  s=String(s==null?'':s).toLowerCase().trim();
  s=s.replace(/ё/g,'е');
  s=s.replace(/[.,!?;:()"'«»’]/g,' ');
  s=s.replace(/[\/\-–—]/g,' ');
  s=s.replace(/\s+/g,' ').trim();
  return s;
}
function stripLead(s,lang){return (lang==='en')?s.replace(/^(to|a|an|the)\s+/,'').trim():s;}
function answerMatches(typed,correct,lang){
  const cand=new Set();
  const add=v=>{if(v){cand.add(v);const st=stripLead(v,lang);if(st)cand.add(st);}};
  String(correct==null?'':correct).split(/[,;\/]|\s[—–-]\s/).forEach(raw=>{
    add(normAns(raw));
    add(normAns(raw.replace(/\([^)]*\)/g,' ')));
  });
  if(!cand.size)return false;
  const typedParts=String(typed==null?'':typed).split(/[,;\/]|\s[—–-]\s/).map(p=>normAns(p)).filter(Boolean);
  if(!typedParts.length)return false;
  return typedParts.every(ans=>cand.has(ans)||cand.has(stripLead(ans,lang)));
}
function evalTest(){
  if(!game||game.mode!=='test'||game.answered)return;
  const w=game.words[game.i];const typed=document.getElementById('fcAnswer').value;
  const targetLang=(game.front==='en')?'ru':'en';
  const correctText=(game.front==='en')?(w.ru||''):(w.en||'');
  revealTest(answerMatches(typed,correctText,targetLang),typed);
}

function revealTest(ok,typed){
  if(game.answered)return;
  game.answered=true;
  const w=game.words[game.i];
  if(!w.stats)w.stats={seen:0,right:0,wrong:0};
  w.stats.seen++;if(ok)w.stats.right++;else{w.stats.wrong++;game.wrong.push(w);}
  game.disputable=!ok;
  save();
  const badge=document.getElementById('fcBadge');badge.style.display='';
  if(ok){badge.className='fc-badge ok';badge.textContent=t('badge_ok');}
  else{const tp=(typed||'').trim();badge.className='fc-badge no';badge.textContent=t('badge_no')+' · '+(tp?t('badge_your',tp):t('badge_empty'));}
  document.getElementById('fcAnswer').disabled=true;
  const c=document.getElementById('flashcard');c.classList.add('flipped');updateFaceHidden();
  configureControls();
  cancelCardAudio();
  if(game.autoplay)cardAutoplay(w);
  document.getElementById('fcNext').focus();
}
function disputeAnswer(){
  if(!game||game.mode!=='test'||!game.answered||!game.disputable)return;
  const w=game.words[game.i];
  if(!w.stats)w.stats={seen:0,right:0,wrong:0};
  if(w.stats.wrong>0)w.stats.wrong--;
  w.stats.right++;
  const idx=game.wrong.lastIndexOf(w);if(idx>=0)game.wrong.splice(idx,1);
  game.disputable=false;

function recordTimer(){
  if(!game||!game.timer||!game.groupId)return null;
  const elapsed=(Date.now()-game.startTime)+(game.carryMs||0);
  if(game.wrong.length>0)return {elapsed,saved:false,hadMistakes:true};
  const g=state.groups.find(x=>x.id===game.groupId);if(!g)return {elapsed,saved:false};
  if(!g.timer||typeof g.timer!=='object')g.timer={};
  const k=game.front;const prev=g.timer[k]||{best:0,last:0,runs:0};
  const isBest=!prev.best||elapsed<prev.best;
  g.timer[k]={best:isBest?elapsed:prev.best,last:elapsed,runs:(prev.runs||0)+1};
  save();
  return {elapsed,best:g.timer[k].best,isBest,saved:true};
}

async function fetchRandomWordsBatch(){
  let d=await fetchJSON('https://random-word-api.vercel.app/api?words=10');
  if(Array.isArray(d)&&d.length)return d;
  const len=4+Math.floor(Math.random()*5);
  d=await fetchJSON('https://api.datamuse.com/words?max=200&sp='+encodeURIComponent('?'.repeat(len)));
  if(Array.isArray(d)&&d.length)return d.map(x=>x&&x.word).filter(Boolean);
  return [];
}
async function fetchRandomWord(){
  const existing=new Set(state.words.map(w=>w.en.toLowerCase()));
  for(let attempt=0;attempt<8;attempt++){
    let batch=[];
    try{batch=await fetchRandomWordsBatch();}catch(e){batch=[];}
    if(!batch.length){if(isOffline())return null;continue;}
    shuffle(batch);
    for(const raw of batch){
      const cw=String(raw||'').toLowerCase().trim();
      if(/^[a-z][a-z’'-]{2,14}$/.test(cw)&&!existing.has(cw))return cw;
    }
    if(isOffline())return null;
  }
  return null;
}

      <div class="muted">${t('result_accuracy')} ${total?Math.round(right/total*100):0}%</div>`;
    if(timerRes){
      html+=`<div class="timer-stat" style="font-size:14px;margin-top:10px">⏱ ${t('result_time')}: <b>${fmtTime(timerRes.elapsed)}</b>`;
      if(timerRes.saved)html+=` · ${t('result_bestTime')}: <b>${fmtTime(timerRes.best)}</b>${timerRes.isBest?(' · '+t('result_newBest')):''}`;
      else if(timerRes.hadMistakes)html+=` · ${t('result_timeNotSaved')}`;
      html+=`</div>`;
    }
    html+=`</div>`;
    if(wrong)html+=`<div class="card"><h2>${t('result_mistakes')}</h2><div id="wrongList"></div></div>`;
    html+=`<div class="split" style="justify-content:center;gap:12px"><button class="btn" id="againAll">${t('btn_againAll')}</button>`;
    if(wrong)html+=`<button class="btn ghost" id="againWrong">${t('btn_againWrong')}</button>`;
    html+=`<button class="btn ghost" id="backSetup">${t('btn_backSetup')}</button></div>`;
  }
  res.innerHTML=html;
  if(game.mode==='random'){wireRandomResult(res);return;}
  const againAll=res.querySelector('#againAll');if(againAll)againAll.onclick=()=>startGameWith((game.source||game.words).slice(),{groupId:game.groupId,mode:game.mode});
  const backSetup=res.querySelector('#backSetup');if(backSetup)backSetup.onclick=renderCardSetup;
  if(game.mode==='test'&&game.wrong.length){
    const wl=res.querySelector('#wrongList');
    game.wrong.forEach(w=>{
      const r=document.createElement('div');r.className='word-item';
      r.innerHTML=`<button class="icon-btn play" aria-label="${esc(t('listenW',w.en))}">🔊</button>
        <div class="grow"><div><span class="en" lang="en">${esc(cap(w.en))}</span> <span class="ipa">${esc(w.ipa||'')}</span></div><div class="ru">${esc(cap(w.ru||'—'))}</div></div>`;
      r.querySelector('.play').onclick=()=>speak(w.en,w.audio);
      wl.appendChild(r);
    });
    const aw=res.querySelector('#againWrong');if(aw)aw.onclick=()=>startGameWith(game.wrong.slice(),{groupId:game.groupId,mode:'test',carryMs:timerRes?timerRes.elapsed:0,source:game.source});
  }
}
function renderRandomResult(){
  const added=game.added.length;
  let html=`<div class="card" style="text-align:center"><h2>${t('result_randomDone')}</h2>
    <div class="split" style="justify-content:center;gap:40px;margin:14px 0">
      <div><div class="stat-big stat-good">${game.knew}</div><div class="muted">${t('result_knew')}</div></div>
      <div><div class="stat-big stat-bad">${game.dontknow}</div><div class="muted">${t('result_dont')}</div></div>
    </div>
    <div class="muted">${esc(t('random_counter',game.shown,added))}</div></div>`;
  if(added)html+=`<div class="card"><h2>${t('result_added')}</h2><div id="addedList"></div></div>`;
  else html+=`<div class="card"><p class="muted" style="margin:0">${t('result_addedNone')}</p></div>`;
  html+=`<div class="split" style="justify-content:center;gap:12px">
    <button class="btn" id="againAll">${t('btn_continue')}</button>
    <button class="btn ghost" id="backSetup">${t('btn_backSetup')}</button></div>`;
  return html;
}
function wireRandomResult(res){
  const cont=res.querySelector('#againAll');if(cont)cont.onclick=()=>startRandom();
  const back=res.querySelector('#backSetup');if(back)back.onclick=renderCardSetup;
  if(game.added.length){
    const al=res.querySelector('#addedList');
    game.added.forEach(w=>{
      const r=document.createElement('div');r.className='word-item';
      r.innerHTML=`<button class="icon-btn play" aria-label="${esc(t('listenW',w.en))}">🔊</button>
        <div class="grow"><div><span class="en" lang="en">${esc(cap(w.en))}</span> <span class="ipa">${esc(w.ipa||'')}</span></div><div class="ru">${esc(cap(w.ru||'—'))}</div></div>`;
      r.querySelector('.play').onclick=()=>speak(w.en,w.audio);
      al.appendChild(r);
    });
  }
}

function relabelGame(){
  if(!game)return;
  if(game.mode==='random'){
    document.getElementById('fcCounter').textContent=t('random_counter',game.shown,game.added.length);
    document.getElementById('fcHintFront').textContent=game._retry?'':t('fc_hintReveal');
  }else{
    document.getElementById('fcCounter').textContent=(game.mode==='test')?t('counter',Math.min(game.i+1,game.words.length),game.words.length,game.wrong.length):t('counterBasic',game.i+1,game.words.length);
    document.getElementById('fcHintFront').textContent=(game.mode==='test'&&!game.answered)?t('fc_hintGiveUp'):t('fc_hintFront');
    const inp=document.getElementById('fcAnswer');
    if(inp&&game.mode==='test'&&!game.answered)inp.setAttribute('placeholder',t(game.front==='en'?'ph_answer_ru':'ph_answer_en'));
  }
  document.getElementById('fcHintBack').textContent=t('fc_hintBack');
  const cw=(game.mode==='random')?game.current:(game.words&&game.words[game.i]);
  if(cw){document.getElementById('fcFrontPos').textContent=posLabel(cw.pos);document.getElementById('fcBackPos').textContent=posLabel(cw.pos);}
  if(!game._retry)configureControls();
}
function relocalizeCards(){
  const gameOn=document.getElementById('cardGame').style.display!=='none';
  const result=document.getElementById('cardResult').style.display!=='none';
  if(gameOn&&game)relabelGame();
  else if(result&&game)renderResult(game._lastTimer||null);
  else renderCardSetup();
}

document.getElementById('startCards').onclick=()=>{
  if(cardMode==='random'){startRandom();return;}
  const scope=document.getElementById('cardScope').value;
  let words,groupId=null;
  if(scope==='all')words=state.words.slice();
  else if(scope==='hard')words=state.words.filter(w=>acc(w)!==null&&acc(w)<70);
  else if(scope==='new')words=state.words.filter(w=>acc(w)===null);
  else{const gid=document.getElementById('cardGroup').value;const g=state.groups.find(x=>x.id===gid);groupId=g?g.id:null;words=(g?g.wordIds:[]).map(id=>state.words.find(w=>w.id===id)).filter(Boolean);}
  if(!words.length){toast(t('t_noWordsGame'),true);return;}
  startGameWith(words,{groupId});
};
document.querySelectorAll('#cardMode button').forEach(b=>b.onclick=()=>selectMode(b.dataset.mode));
document.getElementById('cardScope').addEventListener('change',updateSetupVisibility);
document.getElementById('cardGroupSearch').addEventListener('input',e=>fillGroupSelect(e.target.value));
(function(){
  const fc=document.getElementById('flashcard');
  fc.addEventListener('click',onCardActivate);
  fc.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'||e.key==='Spacebar'){e.preventDefault();onCardActivate();}});
})();
document.getElementById('fcPlay').onclick=(e)=>{e.stopPropagation();if(!game)return;const w=(game.mode==='random')?game.current:(game.words&&game.words[game.i]);if(w)speak(w.en,w.audio);};
document.getElementById('fcCheck').onclick=()=>evalTest();
document.getElementById('fcAnswer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();evalTest();}});
document.getElementById('fcNext').onclick=()=>{if(game&&game.mode==='random'){nextRandom();return;}advance();};
document.getElementById('fcDispute').onclick=()=>disputeAnswer();
document.getElementById('fcRight').onclick=()=>{if(game&&game.mode==='random')randomAnswer(true);};
document.getElementById('fcWrong').onclick=()=>{if(game&&game.mode==='random')randomAnswer(false);};
document.getElementById('fcQuit').onclick=()=>{
  if(game&&game.mode==='random'){stopTimer();if(game.shown>0)finishGame();else renderCardSetup();return;}
  openConfirm({title:t('c_quit'),message:t('quit_msg'),confirmLabel:t('btn_quit'),danger:true,onConfirm:()=>{stopTimer();renderCardSetup();}});
};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cap(s){s=String(s==null?'':s);if(!s||s==='—')return s;return s.charAt(0).toUpperCase()+s.slice(1);}
function updateBadge(){
  const el=document.getElementById('countBadge');if(!el)return;
  el.textContent=nWords(state.words.length)+' · '+nGroups(state.groups.length);
}

function relocalizeCards(){
  const gameOn=document.getElementById('cardGame').style.display!=='none';
  const result=document.getElementById('cardResult').style.display!=='none';
  if(gameOn&&game)showCard();
  else if(result&&game)renderResult();
  else renderCardSetup();
}
function applyI18n(){
  document.documentElement.lang=lang;
  document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{el.innerHTML=t(el.dataset.i18nHtml);});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.setAttribute('placeholder',t(el.dataset.i18nPh));});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.i18nAria));});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.setAttribute('title',t(el.dataset.i18nTitle));});
  fillPosSelects();
  updateBadge();
  if(document.getElementById('tab-dict').style.display!=='none')renderDict();
  if(document.getElementById('tab-groups').style.display!=='none')renderGroups();
  if(document.getElementById('tab-cards').style.display!=='none')relocalizeCards();
}
function setLang(l){
  if(l!=='en'&&l!=='ru')return;
  lang=l;
  try{localStorage.setItem(LANG_KEY,l);}catch(e){}
  document.querySelectorAll('#langSwitch button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.setlang===l?'true':'false'));
  applyI18n();
}

window.addEventListener('error',()=>{try{toast(t('t_err'),true);}catch(e){}});
window.addEventListener('unhandledrejection',()=>{try{toast(t('t_rejErr'),true);}catch(e){}});

load();
document.querySelectorAll('#langSwitch button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.setlang===lang?'true':'false');b.onclick=()=>setLang(b.dataset.setlang);});
applyI18n();
document.getElementById('addEn').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('fetchBtn').click();});
document.getElementById('newGroupName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('createGroup').click();}});
document.getElementById('settingsBtn').onclick=openSettings;
const modalEl=document.getElementById('modal');
modalEl.addEventListener('click',e=>{if(e.target===modalEl)requestCloseModal();});
modalEl.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return;
  const f=getFocusable();if(!f.length){e.preventDefault();return;}
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
const confirmEl=document.getElementById('confirmOverlay');
confirmEl.addEventListener('click',e=>{if(e.target===confirmEl)closeConfirm();});
confirmEl.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeConfirm();return;}
  if(e.key!=='Tab')return;
  const f=Array.from(document.getElementById('confirmBox').querySelectorAll('button:not([disabled])')).filter(el=>el.offsetParent!==null);
  if(!f.length){e.preventDefault();return;}
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('confirmOverlay').style.display==='none'&&modalEl.style.display!=='none')requestCloseModal();});
let fitResizeT;window.addEventListener('resize',()=>{clearTimeout(fitResizeT);fitResizeT=setTimeout(()=>{if(game&&document.getElementById('cardGame').style.display!=='none')fitCards();},150);});
</script>
</body>
</html>
